<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events Playground</title>
  <script src="events.js" defer></script>
  <style>
    .highlight { background-color: gold; 
    }
    .over-limit {
      color: red;
      font-weight: bold;
    }
    .button-column {
      display: flex;
      gap: 0.75rem;
      flex-direction: column;
      align-items: flex-start;
    }
    .greeting-column {
      display: flex;
      gap: 0.25rem;
      flex-direction: column;
      align-items: flex-start;
    }
    .error { color: crimson;
    }
  </style>
</head>
<body>
  <h1 id="title">Events Playground</h1>

  <div class="button-column">
    <button id="counter-btn">Clicked 0 times</button>
    <button id="reset-btn">Reset</button>
  </div>
  <p>
    <label for="name-input">Your name</label>
    <input id="name-input" type="text" placeholder="Type here">
  </p>
  <div class="greeting-column">
    <p id="greeting"></p>
    <p id="word-counter"></p>
  </div>

  <form id="demo-form">
    <label for="amount-input">Amount (yen)</label>
    <input id="amount-input" type="number" min="1" required>
    <button type="submit">Add</button>
    <p id="total">Total: ¥0</p>
  </form>
  <ul id="log"></ul>
</body>
</html>
