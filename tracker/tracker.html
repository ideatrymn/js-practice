<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="tracker.css">
  <script src="logic.js" defer></script>
  <script src="app.js" defer></script>
</head>

<body>
  <main>
    <h1>Expense Tracker</h1>
    <section id="summary" class="cards"></section>
    <section>
      <h2>Add expense</h2>
      <form id="expense-form">
        <div class="controls">
          <div class="field field-wide">
            <label for="item-input">Item</label>
            <input id="item-input" type="text" maxlength="60" required>
          </div>

          <div class="field">
            <label for="amount-input">Amount (yen)</label>
            <input id="amount-input" type="number" min="1" step="1" required>
          </div>

          <div class="field">
            <label for="category-input">Category</label>
            <select id="category-input">
              <option value="food">Food</option>
              <option value="transport">Transport</option>
              <option value="learning">Learning</option>
              <option value="fun">Fun</option>
              <option value="loan">Loan</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="field field-button">
            <button type="submit">Add expense</button>
          </div>
        </div>
        <p id="form-error" class="error" role="alert"></p>
      </form>
    </section>
    <h2>All expenses</h2>
    <div class="controls">
      <div class="field">
        <label for="search-input">Search</label>
        <input id="search-input" type="search" placeholder="Search by item name">
      </div>

      <div class="field">
        <label for="sort-select">Sort by</label>
        <select id="sort-select">
          <option value="amount-desc">Amount (high to low)</option>
          <option value="amount-asc">Amount (low to high)</option>
          <option value="name-asc">Name (A to Z)</option>
          <option value="category-asc">Category (A to Z)</option>
        </select>
      </div>

      <div class="field">
        <label for="filter-select">Show</label>
        <select id="filter-select"></select>
      </div>
    </div>
    <p id="filter-status"></p>
    <p id="no-matches" class="hidden">No expenses in this category.</p>
    <p id="empty-message" class="hidden">No expenses yet.</p>
    <p id="undo-bar" class="hidden">
      <span id="undo-text"></span>
      <button type="button" id="undo-btn">Undo</button>
    </p>
    <div class="table-wrap">
      <table id="expense-table">
        <thead>
          <tr>
            <th scope="col">Item</th>
            <th scope="col">Category</th>
            <th scope="col">Amount</th>
            <th scope="col">Delete</th>
          </tr>
        </thead>
        <tbody id="expense-body"></tbody>
      </table>
    </div>
    </section>

    <section>
      <h2>By category</h2>
      <ul id="category-list"></ul>
    </section>

    <section>
      <h2> Text report</h2>
      <pre id="report"></pre>
    </section>

    <section>
      <h2>Date</h2>
      <p>
        <button type="button" id="reset-btn"> Reset to sample data</button>
      </p>
    </section>
  </main>
</body>

</html>
